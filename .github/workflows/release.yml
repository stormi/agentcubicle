name: release

# Pushing a vX.Y.Z tag publishes a GitHub release for it, with the script
# attached for those who install it without git. The tag has to match
# AGENTCUBICLE_VERSION in the script, which is what the script compares against
# the latest release (see CONTRIBUTING.md, "Releasing"). The engine tests in
# engines.yml run on the same tag push, separately.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches the script version
        run: |
          set -eu
          tag_version="${GITHUB_REF_NAME#v}"
          script_version="$(sed -n 's/^AGENTCUBICLE_VERSION="\([^"]*\)"$/\1/p' agentcubicle)"
          if ! printf '%s\n' "$tag_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag $GITHUB_REF_NAME is not of the form vX.Y.Z."
            exit 1
          fi
          if [ "$tag_version" != "$script_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match AGENTCUBICLE_VERSION=\"$script_version\" in agentcubicle."
            exit 1
          fi

      - name: Syntax check
        run: bash -n agentcubicle

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" agentcubicle --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
