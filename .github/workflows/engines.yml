name: engines

# Exercises both container-engine paths on GitHub-hosted runners, which ship
# podman and docker preinstalled (podman with subuid/subgid configured for the
# runner user). The point is to verify what we cannot test locally: a file
# written from inside the container lands owned by the host (runner) user.
#
#   rootless (podman): via --userns=keep-id, run as the mapped user directly.
#   rootful  (docker): via the root-phase usermod/chown remap.
#
# Ubuntu runners are not SELinux-enforcing, so :z/:Z and label=disable handling
# is not exercised here.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        engine: [podman, docker]
    env:
      AGENTCUBICLE_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v5

      - name: Environment info
        run: |
          set -x
          "$AGENTCUBICLE_ENGINE" --version
          id
          if [ "$AGENTCUBICLE_ENGINE" = podman ]; then cat /etc/subuid /etc/subgid; fi

      - name: Build image
        run: ./agentcubicle setup

      # Seed the host opencode config BEFORE any container runs. If left to the
      # first run, mounting the nonexistent config dir as a bind source makes
      # docker auto-create it root-owned on the host (and trips podman), so it
      # must exist and be runner-owned up front.
      - name: Seed host opencode config
        run: |
          set -eux
          mkdir -p "$HOME/.config/opencode"
          printf '{"theme":"ci-marker-config"}\n' > "$HOME/.config/opencode/opencode.json"

      - name: Run headless and assert ownership + config forwarding
        run: |
          set -euxo pipefail
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          rm -f probe.txt cfgprobe.txt
          # AGENTCUBICLE_TEST_CMD replaces the interactive tool launch with a
          # non-interactive command so the real run path can be driven in CI.
          AGENTCUBICLE_TEST_CMD='id -u > /home/user/project/probe.txt; id -un >> /home/user/project/probe.txt; cat /home/user/.config/opencode/opencode.json > /home/user/project/cfgprobe.txt' \
            ./agentcubicle opencode
          echo "--- probe.txt (in-container id) ---"; cat probe.txt
          echo "--- cfgprobe.txt (config seen inside container) ---"; cat cfgprobe.txt
          # In-container UID differs by engine: podman keep-id runs as the
          # image's baked UID 1000; docker remaps the user to the host UID.
          if [ "$AGENTCUBICLE_ENGINE" = podman ]; then expected_uid=1000; else expected_uid="$(id -u)"; fi
          test "$(sed -n 1p probe.txt)" = "$expected_uid"
          # Host-side, the file must be owned by the runner user in both cases,
          # proving the mapping round-trips container writes back to the host user.
          owner="$(stat -c %U probe.txt)"
          echo "host owner: $owner ; runner: $(id -un)"
          test "$owner" = "$(id -un)"
          # The host config must have been staged and copied into place inside
          # the container by the entrypoint (under /root for docker, under
          # /home/user for podman).
          grep -q ci-marker-config cfgprobe.txt

      # rtk is baked into the base image and its OpenCode plugin is seeded into
      # the container's opencode config on an opencode run, unless --no-rtk.
      # Driven headlessly the same way as the config-forwarding assertion above.
      - name: Assert rtk binary + opencode plugin wiring
        run: |
          set -euxo pipefail
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          rm -f rtkprobe.txt
          # Default opencode run: rtk present, plugin written by the entrypoint.
          AGENTCUBICLE_TEST_CMD='command -v rtk > /home/user/project/rtkprobe.txt; rtk --version >> /home/user/project/rtkprobe.txt 2>&1; ls -l /home/user/.config/opencode/plugins/rtk.ts >> /home/user/project/rtkprobe.txt 2>&1' \
            ./agentcubicle opencode
          echo "--- rtkprobe.txt (default run) ---"; cat rtkprobe.txt
          # rtk --version prints e.g. "rtk 0.50.0".
          grep -Eq '^rtk [0-9]+\.' rtkprobe.txt
          grep -q "plugins/rtk.ts" rtkprobe.txt
          # --no-rtk: rtk still present, but the plugin is not seeded.
          rm -f rtkprobe.txt
          AGENTCUBICLE_TEST_CMD='command -v rtk > /home/user/project/rtkprobe.txt; ls /home/user/.config/opencode/plugins/rtk.ts >> /home/user/project/rtkprobe.txt 2>&1 || echo "plugin absent" >> /home/user/project/rtkprobe.txt' \
            ./agentcubicle opencode --no-rtk
          echo "--- rtkprobe.txt (--no-rtk run) ---"; cat rtkprobe.txt
          grep -q "plugin absent" rtkprobe.txt

      # ponytail is instruction-only (no binary, no plugin), so nothing is baked
      # into the image; agentcubicle seeds its ruleset into the project's
      # .agentcubicle/ dir on an opencode run, unless --no-ponytail. Driven
      # headlessly like the rtk assertion. The file lives in the persistent
      # project mount, so the --no-ponytail leg must start from a clean
      # .agentcubicle/ to prove the flag suppresses the write, not a re-read.
      - name: Assert ponytail ruleset wiring
        run: |
          set -euxo pipefail
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          rm -f ponytailprobe.txt
          # Default opencode run: ponytail ruleset seeded into the project mount.
          AGENTCUBICLE_TEST_CMD='ls -l /home/user/project/.agentcubicle/ponytail.md > /home/user/project/ponytailprobe.txt 2>&1 || echo "ponytail absent" >> /home/user/project/ponytailprobe.txt' \
            ./agentcubicle opencode
          echo "--- ponytailprobe.txt (default run) ---"; cat ponytailprobe.txt
          grep -q "ponytail.md" ponytailprobe.txt
          # The seeded content is a verbatim copy of ponytail's ruleset.
          grep -q "lazy senior dev" .agentcubicle/ponytail.md
          # --no-ponytail: ruleset not seeded. .agentcubicle/ persists across runs
          # in this job (it is in the project mount), so clear it first.
          rm -f .agentcubicle/ponytail.md ponytailprobe.txt
          AGENTCUBICLE_TEST_CMD='ls -l /home/user/project/.agentcubicle/ponytail.md > /home/user/project/ponytailprobe.txt 2>&1 || echo "ponytail absent" >> /home/user/project/ponytailprobe.txt' \
            ./agentcubicle opencode --no-ponytail
          echo "--- ponytailprobe.txt (--no-ponytail run) ---"; cat ponytailprobe.txt
          grep -q "ponytail absent" ponytailprobe.txt

      # Containers are removed when the tool exits; --keep-container opts out.
      - name: Assert container removal on exit
        run: |
          set -euxo pipefail
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          "$AGENTCUBICLE_ENGINE" rm -f ac-rmtest-default ac-rmtest-keep 2>/dev/null || true
          # Default: nothing left behind.
          AGENTCUBICLE_TEST_CMD='true' ./agentcubicle opencode --name ac-rmtest-default
          left="$("$AGENTCUBICLE_ENGINE" ps -a --filter name=ac-rmtest-default --format '{{.Names}}')"
          echo "after default run: [$left]"
          test -z "$left"
          # --keep-container: the container is still there afterwards.
          AGENTCUBICLE_TEST_CMD='true' ./agentcubicle opencode --name ac-rmtest-keep --keep-container
          kept="$("$AGENTCUBICLE_ENGINE" ps -a --filter name=ac-rmtest-keep --format '{{.Names}}')"
          echo "after --keep-container run: [$kept]"
          test "$kept" = ac-rmtest-keep
          "$AGENTCUBICLE_ENGINE" rm -f ac-rmtest-keep

      # The claude settings.json in claude-home is seeded once, except for the
      # CLAUDE_PROPAGATE_KEYS allowlist, which is re-read from the host on every
      # run. Both the seed and the later overwrite are checked here, plus that
      # the overwrite leaves the rest of the persisted file alone.
      - name: Assert claude statusLine propagation
        run: |
          set -euxo pipefail
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          mkdir -p "$HOME/.claude"
          probe='cat /home/user/project/.agentcubicle/claude-home/settings.json > /home/user/project/settings-probe.json'

          # First run: fresh seed from the host file.
          rm -rf .agentcubicle/claude-home settings-probe.json
          printf '{"model":"ci-marker-model","statusLine":{"type":"command","command":"echo ci-marker-one"}}\n' > "$HOME/.claude/settings.json"
          AGENTCUBICLE_TEST_CMD="$probe" ./agentcubicle claude
          cat settings-probe.json
          test "$(jq -r .statusLine.command settings-probe.json)" = "echo ci-marker-one"
          test "$(jq -r .model settings-probe.json)" = "ci-marker-model"

          # Something written in-container, which the propagation must not touch.
          jq '. + {model: "ci-marker-in-container"}' settings-probe.json > tmp.json
          mv tmp.json .agentcubicle/claude-home/settings.json

          # Second run: host statusLine changed, container already seeded.
          rm -f settings-probe.json
          printf '{"model":"ci-marker-model","statusLine":{"type":"command","command":"echo ci-marker-two"}}\n' > "$HOME/.claude/settings.json"
          AGENTCUBICLE_TEST_CMD="$probe" ./agentcubicle claude
          cat settings-probe.json
          test "$(jq -r .statusLine.command settings-probe.json)" = "echo ci-marker-two"
          test "$(jq -r .model settings-probe.json)" = "ci-marker-in-container"

          # Third run: a host script path is not propagated, and warns.
          rm -f settings-probe.json
          printf '{"statusLine":{"type":"command","command":"~/.claude/statusline.sh"}}\n' > "$HOME/.claude/settings.json"
          AGENTCUBICLE_TEST_CMD="$probe" ./agentcubicle claude 2> warn.txt || { cat warn.txt; exit 1; }
          cat warn.txt settings-probe.json
          grep -q "not propagating statusLine" warn.txt
          test "$(jq -r .statusLine.command settings-probe.json)" = "echo ci-marker-two"

          # Fourth run: same non-inline value, but a fresh seed must not pick it
          # up through the seed copy either.
          rm -rf .agentcubicle/claude-home settings-probe.json
          AGENTCUBICLE_TEST_CMD="$probe" ./agentcubicle claude
          cat settings-probe.json
          test "$(jq -r .statusLine settings-probe.json)" = "null"

      # Running as root cannot work (the UID remap collides with the container
      # root account and config would be read from /root), so it is refused up
      # front. Host-side and engine-independent, but run on both legs anyway.
      # `env` passes the engine through because sudo resets the environment;
      # the value does not affect the outcome, since the check precedes engine
      # detection.
      - name: Assert root/sudo invocation is refused
        run: |
          set -euxo pipefail
          # Fail loudly on a sudo problem rather than letting it masquerade as
          # the refusal under test.
          sudo -n true
          if sudo -n env AGENTCUBICLE_ENGINE="$AGENTCUBICLE_ENGINE" ./agentcubicle opencode > sudoout.txt 2> sudoerr.txt; then
            echo "expected a non-zero exit under sudo"
            cat sudoout.txt sudoerr.txt
            exit 1
          fi
          cat sudoout.txt sudoerr.txt
          grep -q "does not run as root" sudoerr.txt
          # It must bail before any container work starts.
          ! grep -q "Starting container" sudoout.txt
          # SUDO_USER is set here, so the message names the invoking user.
          grep -q "$(id -un)" sudoerr.txt
